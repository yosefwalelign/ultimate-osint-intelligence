version: '3.9'

services:
  # Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osint-app
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - DATABASE_URL=postgresql://osint:osint@db:5432/osint
      - REDIS_URL=redis://redis:6379/0
      - TOR_PROXY=socks5://tor:9050
    depends_on:
      - db
      - redis
      - tor
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
    networks:
      - osint-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: osint-db
    environment:
      - POSTGRES_USER=osint
      - POSTGRES_PASSWORD=osint
      - POSTGRES_DB=osint
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - osint-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: osint-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - osint-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TOR Network
  tor:
    image: osminogin/tor-simple:latest
    container_name: osint-tor
    ports:
      - "9050:9050"
      - "9051:9051"
    volumes:
      - tor_data:/var/lib/tor
    networks:
      - osint-network
    restart: unless-stopped

  # Elasticsearch (Optional - for advanced search)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: osint-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - osint-network
    restart: unless-stopped
    profiles:
      - optional

  # Kibana (Optional - for visualization)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: osint-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - osint-network
    restart: unless-stopped
    profiles:
      - optional

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: osint-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - osint-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  db_data:
  redis_data:
  tor_data:
  es_data:

networks:
  osint-network:
    driver: bridge
